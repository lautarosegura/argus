name: Release installer

# Builds Argus-Setup.exe with Inno Setup when a v* tag is pushed.
# See research/architecture-decisions-v1.md §A20 for the toolchain rationale.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to embed in installer (e.g. 0.1.0)'
        required: true
        default: '0.1.0-dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $v = '${{ github.ref_name }}' -replace '^v',''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Compile TypeScript
        run: npx tsc -p tsconfig.build.json

      - name: Build daemon (argusd.exe)
        run: npx pkg dist/build/src/daemon/main.js --targets node22-win-x64 --output dist/daemon/argusd.exe

      - name: Build Electron app (Argus.exe)
        run: npx electron-builder --win dir --config electron-builder.yml

      - name: Build CLI (argus.exe + workspace.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/cli | Out-Null
          bun build cli/main.ts --compile --target=bun-windows-x64 --outfile dist/cli/argus.exe
          Copy-Item dist/cli/argus.exe dist/cli/workspace.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer/argus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: Argus-Setup
          path: dist/installer/Argus-Setup.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/Argus-Setup.exe
          draft: true
          generate_release_notes: true
